<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即时翻译悬浮窗</title>
  <style>
    /* 全局样式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-dark);
      background: transparent;
      overflow: hidden;
    }

    /* 变量定义 */
    :root {
      --primary-blue: #3b82f6;
      --primary-blue-hover: #2563eb;
      --text-dark: #1d1d1f;
      --text-light: #76767a;
      --border-light: #e5e7eb;
      --bg-light: #f9fafb;
      --bg-white: #ffffff;
      --success-green: #10b981;
      --error-red: #ef4444;
      --warning-yellow: #f59e0b;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.05);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    /* 输入框样式 */
    textarea, input {
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      max-height: 200px;
    }

    /* 按钮基础样式 */
    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* 主容器 */
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    /* Header 区域 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-light);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      margin-bottom: 12px;
      height: 44px;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drag-handle {
      width: 20px;
      height: 20px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drag-handle svg {
      width: 16px;
      height: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dark);
    }

    .brand img {
      width: 18px;
      height: 18px;
    }

    .right-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .engine-select {
      padding: 4px 8px;
      font-size: 12px;
      color: var(--text-light);
      background: var(--bg-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      cursor: pointer;
      outline: none;
      height: 28px;
    }

    .width-adjust-btn, .close-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      padding: 0;
      border-radius: var(--radius-sm);
    }

    .width-adjust-btn:hover, .close-btn:hover {
      background: var(--bg-light);
      color: var(--primary-blue);
    }

    /* 翻译区域 */
    .translate-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .input-group, .output-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row, .output-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .lang-select {
      padding: 6px 12px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--bg-white);
      font-size: 12px;
      color: var(--text-light);
      outline: none;
      cursor: pointer;
    }

    .swap-btn {
      padding: 6px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--bg-white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swap-btn:hover {
      border-color: var(--primary-blue);
      color: var(--primary-blue);
    }

    .text-input, .text-output {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      resize: vertical;
      min-height: 80px;
      font-size: 14px;
      line-height: 1.5;
    }

    .text-input:focus, .text-output:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    .text-output {
      background: var(--bg-light);
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-blue);
      color: white;
      border: none;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-blue-hover);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      background: var(--bg-white);
      border-color: var(--primary-blue);
    }

    .btn-icon {
      padding: 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      background: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      border-color: var(--primary-blue);
      color: var(--primary-blue);
    }

    .output-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* 加载状态 */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-light);
      font-size: 13px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border-light);
      border-top: 2px solid var(--primary-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 错误状态 */
    .error {
      color: var(--error-red);
      font-size: 13px;
      margin-top: 8px;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .container {
        padding: 12px;
      }
      
      .header {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header 区域 -->
    <div class="header">
      <div class="left-section">
        <div class="drag-handle" id="dragHandle" title="拖拽">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/>
            <circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/>
          </svg>
        </div>
        <div class="brand">
          <img src="icons/icon.png" alt="logo">
          即时翻译
        </div>
      </div>
      <div class="right-section">
        <select class="engine-select" id="engineSelect">
          <option value="google">谷歌翻译</option>
          <option value="ai">AI 引擎</option>
        </select>
        <button class="width-adjust-btn" id="widthAdjustBtn" title="调整宽度">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 14h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            <line x1="12" y1="3" x2="12" y2="21"/>
          </svg>
        </button>
        <button class="close-btn" id="closeBtn" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 翻译区域 -->
    <div class="translate-area">
      <div class="input-group">
        <div class="input-row">
          <select class="lang-select" id="fromLang">
            <option value="auto">自动检测</option>
            <option value="zh">中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
            <option value="ru">俄语</option>
            <option value="ar">阿拉伯语</option>
            <option value="pt">葡萄牙语</option>
          </select>
          <button class="swap-btn" id="swapBtn" title="交换语言">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
        </div>
        <textarea class="text-input" id="inputText" placeholder="请输入要翻译的文本..."></textarea>
        <div class="action-buttons">
          <button class="btn btn-secondary" id="pasteBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            粘贴
          </button>
          <button class="btn btn-primary" id="translateBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5h12M3 12h12M3 19h12"></path>
              <path d="M18 5v7M21 9h-6M18 12v7M21 15h-6"></path>
            </svg>
            翻译
          </button>
        </div>
      </div>

      <div class="output-group">
        <div class="output-row">
          <select class="lang-select" id="toLang">
            <option value="zh">中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
            <option value="ru">俄语</option>
            <option value="ar">阿拉伯语</option>
            <option value="pt">葡萄牙语</option>
          </select>
        </div>
        <div class="text-output" id="outputText">翻译结果将显示在这里...</div>
        <div class="output-actions">
          <button class="btn btn-icon" id="speakBtn" title="朗读">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
          <button class="btn btn-icon" id="copyBtn" title="复制">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 状态管理
    const state = {
      currentEngine: 'google',
      isTranslating: false,
      fromLang: 'auto',
      toLang: 'zh'
    };

    // DOM 元素
    const els = {
      fromLang: document.getElementById('fromLang'),
      toLang: document.getElementById('toLang'),
      swapBtn: document.getElementById('swapBtn'),
      inputText: document.getElementById('inputText'),
      translateBtn: document.getElementById('translateBtn'),
      outputText: document.getElementById('outputText'),
      speakBtn: document.getElementById('speakBtn'),
      copyBtn: document.getElementById('copyBtn'),
      engineSelect: document.getElementById('engineSelect'),
      dragHandle: document.getElementById('dragHandle'),
      widthAdjustBtn: document.getElementById('widthAdjustBtn'),
      closeBtn: document.getElementById('closeBtn')
    };

    // 初始化
    function init() {
      // 加载保存的设置
      chrome.storage.sync.get(['engine', 'fromLang', 'toLang'], (result) => {
        if (result.engine) {
          state.currentEngine = result.engine;
          els.engineSelect.value = result.engine;
        }
        if (result.fromLang) {
          state.fromLang = result.fromLang;
          els.fromLang.value = result.fromLang;
        }
        if (result.toLang) {
          state.toLang = result.toLang;
          els.toLang.value = result.toLang;
        }
      });

      // 绑定事件
      bindEvents();
    }

    // 绑定事件
    function bindEvents() {
      // 引擎选择
      els.engineSelect.addEventListener('change', (e) => {
        state.currentEngine = e.target.value;
        chrome.storage.sync.set({ engine: state.currentEngine });
      });

      // 语言选择
      els.fromLang.addEventListener('change', (e) => {
        state.fromLang = e.target.value;
        chrome.storage.sync.set({ fromLang: state.fromLang });
      });

      els.toLang.addEventListener('change', (e) => {
        state.toLang = e.target.value;
        chrome.storage.sync.set({ toLang: state.toLang });
      });

      // 交换语言
      els.swapBtn.addEventListener('click', swapLanguages);

      // 翻译按钮
      els.translateBtn.addEventListener('click', performTranslation);

      // 粘贴按钮
      els.pasteBtn?.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          els.inputText.value = text;
          performTranslation();
        } catch (err) {
          console.error('粘贴失败:', err);
          els.outputText.textContent = '粘贴失败，请手动复制文本';
        }
      });

      // 朗读按钮
      els.speakBtn.addEventListener('click', () => {
        const text = els.outputText.textContent;
        if (text && text !== '翻译结果将显示在这里...') {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = state.toLang === 'zh' ? 'zh-CN' : state.toLang;
          speechSynthesis.speak(utterance);
        }
      });

      // 复制按钮
      els.copyBtn.addEventListener('click', async () => {
        const text = els.outputText.textContent;
        if (text && text !== '翻译结果将显示在这里...') {
          try {
            await navigator.clipboard.writeText(text);
            // 简单的视觉反馈
            els.copyBtn.innerHTML = `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            `;
            setTimeout(() => {
              els.copyBtn.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              `;
            }, 1000);
          } catch (err) {
            console.error('复制失败:', err);
          }
        }
      });

      // 关闭按钮
      els.closeBtn.addEventListener('click', () => {
        window.close(); // 关闭悬浮窗
      });

      // 宽度调整按钮
      let currentWidthIdx = 0;
      const widthOptions = ['default', 'half', 'third'];
      
      els.widthAdjustBtn.addEventListener('click', () => {
        currentWidthIdx = (currentWidthIdx + 1) % widthOptions.length;
        const newState = widthOptions[currentWidthIdx];
        
        // 保存宽度状态
        chrome.storage.local.set({ widthState: newState });
        
        // 发送消息到 content script 调整宽度
        chrome.runtime.sendMessage({ 
          type: 'jt_width_changed', 
          widthState: newState 
        }).catch(() => {});
      });

      // 拖拽功能
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      els.dragHandle.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        // 获取当前位置
        const rect = document.body.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        
        els.dragHandle.style.cursor = 'grabbing';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        
        // 保存拖拽偏移量
        chrome.storage.local.set({
          dragDeltaX: deltaX,
          dragDeltaY: deltaY,
          isDragging: true
        });
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          els.dragHandle.style.cursor = 'grab';
          
          // 重置拖拽状态
          setTimeout(() => {
            chrome.storage.local.set({ isDragging: false });
          }, 100);
        }
      });

      // 输入框回车翻译
      els.inputText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          performTranslation();
        }
      });
    }

    // 交换语言
    function swapLanguages() {
      const fromValue = els.fromLang.value;
      const toValue = els.toLang.value;
      
      els.fromLang.value = toValue;
      els.toLang.value = fromValue;
      
      const inputValue = els.inputText.value;
      const outputValue = els.outputText.textContent;
      
      els.inputText.value = outputValue;
      els.outputText.textContent = inputValue;
      
      state.fromLang = toValue;
      state.toLang = fromValue;
      
      chrome.storage.sync.set({ 
        fromLang: state.fromLang, 
        toLang: state.toLang 
      });
    }

    // 执行翻译
    async function performTranslation() {
      const text = els.inputText.value.trim();
      if (!text) {
        els.outputText.textContent = '请输入要翻译的文本';
        return;
      }

      if (state.isTranslating) return;

      state.isTranslating = true;
      els.translateBtn.disabled = true;
      els.outputText.textContent = '翻译中...';

      try {
        const response = await chrome.runtime.sendMessage({
          type: 'jt_translate_text',
          engine: state.currentEngine,
          from: state.fromLang,
          to: state.toLang,
          text: text
        });

        if (response && response.text) {
          els.outputText.textContent = response.text;
        } else {
          els.outputText.textContent = '翻译失败，请稍后重试';
        }
      } catch (error) {
        console.error('翻译错误:', error);
        els.outputText.textContent = '翻译服务暂时不可用';
      } finally {
        state.isTranslating = false;
        els.translateBtn.disabled = false;
      }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
