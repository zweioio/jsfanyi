<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试发光效果</title>
    <style>
        body {
            background: #fafafa;
            padding: 40px;
        }
        
        .test-card {
            position: relative;
            width: 400px;
            height: 200px;
            background: white;
            border-radius: 16px;
            margin: 40px auto;
            border: 2px solid #e5e5e5;
            overflow: hidden;
        }
        
        /* 外层边框发光 */
        .test-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, 
                #a3a3a3 0%, 
                transparent 25%, 
                transparent 75%, 
                #a3a3a3 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        /* 旋转光晕 */
        .test-card::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 16px;
            background: conic-gradient(
                from var(--start, 0deg),
                transparent 0deg,
                #a3a3a3 60deg,
                transparent 120deg
            );
            opacity: 0;
            filter: blur(10px);
            transition: opacity 0.5s;
        }
        
        .test-card:hover::before {
            opacity: 1;
        }
        
        .test-card:hover::after {
            opacity: 0.8;
            animation: glow-rotate 4s linear infinite;
        }
        
        @keyframes glow-rotate {
            from {
                --start: 0deg;
            }
            to {
                --start: 360deg;
            }
        }
        
        .card-content {
            position: relative;
            z-index: 2;
            padding: 24px;
        }
        
        h3 {
            font-size: 20px;
            color: #171717;
            margin-bottom: 8px;
        }
        
        p {
            color: #525252;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #171717;">鼠标悬浮到卡片上测试效果</h1>
    
    <div class="test-card">
        <div class="card-content">
            <h3>测试卡片</h3>
            <p>将鼠标移动到这上面，应该能看到边框发光效果</p>
        </div>
    </div>
    
    <script>
        // 添加鼠标跟踪
        const card = document.querySelector('.test-card');
        
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const deltaX = x - centerX;
            const deltaY = y - centerY;
            const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI) + 180;
            
            card.style.setProperty('--start', angle + 'deg');
            console.log('鼠标角度:', angle);
        });
        
        card.addEventListener('mouseleave', () => {
            card.style.setProperty('--start', '0deg');
        });
    </script>
</body>
</html>
