<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试径向渐变边框</title>
    <style>
        body {
            background: #fafafa;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .test-card {
            position: relative;
            width: 400px;
            height: 250px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }
        
        /* 内部内容 */
        .test-card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            padding: 24px;
            background: white;
            border-radius: 16px;
            border: 1px solid #e5e5e5;
        }
        
        /* 外层发光容器 */
        .test-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 2px;
            background: radial-gradient(
                80px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                #a3a3a3,
                transparent 40%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        /* 光晕层 */
        .test-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(
                120px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(163, 163, 163, 0.3),
                transparent 60%
            );
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .test-card:hover::before {
            opacity: 1;
        }
        
        .test-card:hover::after {
            opacity: 1;
        }
        
        h3 {
            font-size: 20px;
            color: #171717;
            margin-bottom: 8px;
        }
        
        p {
            color: #525252;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="test-card">
        <div class="test-card-content">
            <h3>测试径向渐变边框</h3>
            <p>鼠标移动到这上面，边框应该跟随鼠标位置发光</p>
            <p style="margin-top: 12px; font-size: 12px; color: #999;">
                鼠标位置：<span id="position">-</span>
            </p>
        </div>
    </div>
    
    <script>
        const card = document.querySelector('.test-card');
        const positionDisplay = document.getElementById('position');
        
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
            
            positionDisplay.textContent = `X: ${x.toFixed(0)}, Y: ${y.toFixed(0)}`;
            
            console.log('鼠标位置:', { x, y });
            console.log('CSS 变量:', {
                mouseX: getComputedStyle(card).getPropertyValue('--mouse-x'),
                mouseY: getComputedStyle(card).getPropertyValue('--mouse-y')
            });
        });
    </script>
</body>
</html>
